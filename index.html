<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Padel App</title>

<style>

body{
font-family: Arial;
background:#f2f2f2;
text-align:center;
margin-top:50px;
}

.container{
background:white;
padding:30px;
width:300px;
margin:auto;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
}

input{
width:90%;
padding:10px;
margin:10px;
}

button{
padding:10px 20px;
margin:10px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<h2>Padel App</h2>

<input id="email" placeholder="email">
<input id="password" type="password" placeholder="contraseña">

<br>

<button onclick="registro()">Registrarse</button>
<button onclick="login()">Entrar</button>

<p id="mensaje"></p>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyDhKVAw6952bEITC4pjoKbEMRFEQhcqgYU",
  authDomain: "padel-app-9e144.firebaseapp.com",
  projectId: "padel-app-9e144",
  storageBucket: "padel-app-9e144.firebasestorage.app",
  messagingSenderId: "849083376311",
  appId: "1:849083376311:web:40e8f10ac167745e806332"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

function registro(){

const email = document.getElementById("email").value;
const password = document.getElementById("password").value;

auth.createUserWithEmailAndPassword(email, password)

.then((userCredential) => {

document.getElementById("mensaje").innerText =
"Usuario registrado correctamente";

})

.catch((error) => {

document.getElementById("mensaje").innerText =
"Error: " + error.message;

});

}

function login(){

const email = document.getElementById("email").value;
const password = document.getElementById("password").value;

auth.signInWithEmailAndPassword(email, password)

.then((userCredential) => {

document.getElementById("mensaje").innerText =
"Usuario conectado correctamente";

})

.catch((error) => {

document.getElementById("mensaje").innerText =
"Error: " + error.message;

});

}

</script>

</body>
</html>
