<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pádel Players Morvedre</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="header">
<img src="logo.png" class="logo">
<div class="title">Pádel Players Morvedre</div>
</div>

<div id="perfil" class="container" style="display:none;">

  <div class="perfil-header">

    <div class="perfil-top">
      <img id="fotoPerfil" class="foto-perfil" src="">

      <div class="perfil-info">
        <div id="nombrePerfil" class="nombre"></div>
        <div id="puntosPerfil" class="puntos"></div>
        <div id="seguidores"></div>

        <button id="btnSeguir" onclick="toggleSeguir()" style="display:none;">
        Seguir
        </button>

      </div>
    </div>

    <button onclick="mostrar('menu')">Volver</button>

    <div class="perfil-stats">
      <div>
        <div id="partidos">0</div>
        <span>Partidos</span>
      </div>

      <div>
        <div id="seguidores">0</div>
        <span>Seguidores</span>
      </div>

      <div>
        <div id="seguidos">0</div>
        <span>Seguidos</span>
      </div>
    </div>

    <div class="perfil-botones">
      <button onclick="editarPerfil()">Editar perfil</button>
      <button class="rojo">Eliminar perfil</button>
    </div>

  </div>

</div>

<!-- LOGIN -->

<div id="login" class="container">

<label>Email</label>
<input id="email">

<label>Contraseña</label>
<input id="pass" type="password">

<button class="btnBlue" onclick="registro()">Registrarse</button>
<button class="btnYellow" onclick="login()">Entrar</button>

<div id="msgAuth" class="error"></div>

</div>

<!-- PERFIL -->

<div id="perfilCompletar" class="container">

<h3>Completar perfil</h3>

<p class="small">Los campos con <span class="req">*</span> son obligatorios</p>

<label>Foto</label>
<input type="file" id="inputFoto" accept="image/*">

<label>Nombre <span class="req">*</span></label>
<input id="nombre">
<div id="msgNombre" class="error"></div>

<label>Sexo <span class="req">*</span></label>

<select id="sexo">
<option value="">Seleccionar</option>
<option value="hombre">Hombre</option>
<option value="mujer">Mujer</option>
</select>

<label>Nivel <span class="req">*</span></label>

<select id="nivelManual">
<option value="">Elegir</option>
<option>0.5</option>
<option>0.75</option>
<option>1</option>
<option>1.25</option>
<option>1.5</option>
<option>1.75</option>
<option>2</option>
<option>2.25</option>
<option>2.5</option>
<option>2.75</option>
<option>3</option>
<option>3.25</option>
<option>3.5</option>
<option>3.75</option>
<option>4</option>
<option>4.25</option>
<option>4.5</option>
<option>4.75</option>
<option>5</option>
<option>5.25</option>
<option>5.5</option>
<option>5.75</option>
<option>6</option>
<option>6.25</option>
<option>6.5</option>
<option>6.75</option>
<option>7</option>
</select>

<button class="btnYellow" onclick="abrirTest()">Descubrir mi nivel</button>

<div id="nivelResultado" class="ok"></div>

<label>Mano <span style="color:red">*</span></label>

<select id="mano">
<option value="">Seleccionar</option>
<option value="derecha">Derecha</option>
<option value="izquierda">Izquierda</option>
</select>

<label>Posición <span style="color:red">*</span></label>

<select id="posicion">
<option value="">Seleccionar</option>
<option value="drive">Drive</option>
<option value="reves">Revés</option>
<option value="cualquiera">Cualquiera</option>
</select>

<p id="msgPerfil" style="color:red;"></p>

<button class="btnBlue" onclick="guardarPerfil()">Guardar perfil</button>

</div>

<!-- TEST NIVEL -->

<div id="testNivel" class="container">

<h3>Test de nivel</h3>

<div class="pregunta">

¿Hace cuánto juegas?

<select id="p1">
<option value="0">Nunca</option>
<option value="1">Menos de 1 año</option>
<option value="2">1-3 años</option>
<option value="3">3-6 años</option>
<option value="4">Más de 6 años</option>
</select>

</div>

<div class="pregunta">

¿Con qué frecuencia juegas?

<select id="p2">
<option value="0">Muy poco</option>
<option value="1">1 vez al mes</option>
<option value="2">2-3 al mes</option>
<option value="3">1 por semana</option>
<option value="4">2 o más por semana</option>
</select>

</div>

<div class="pregunta">

Control de bola

<select id="p3">
<option value="0">Muchos errores</option>
<option value="1">Peloteos cortos</option>
<option value="2">Peloteos medios</option>
<option value="3">Buen control</option>
<option value="4">Control alto</option>
</select>

</div>

<div class="pregunta">

Uso de paredes

<select id="p4">
<option value="0">No</option>
<option value="1">A veces</option>
<option value="2">Con seguridad</option>
<option value="3">Estratégico</option>
<option value="4">Dominio total</option>
</select>

</div>

<div class="pregunta">

Bandeja o víbora

<select id="p5">
<option value="0">No</option>
<option value="1">Intento bandeja</option>
<option value="2">Bandeja estable</option>
<option value="3">Bandeja y víbora</option>
<option value="4">Control ofensivo</option>
</select>

</div>

<div class="pregunta">

Subida a red

<select id="p6">
<option value="0">No</option>
<option value="1">A veces</option>
<option value="2">Normalmente</option>
<option value="3">Buena lectura</option>
<option value="4">Lectura avanzada</option>
</select>

</div>

<div class="pregunta">

Defensa

<select id="p7">
<option value="0">Pierdo rápido</option>
<option value="1">Devuelvo algunas</option>
<option value="2">Defensa estable</option>
<option value="3">Uso paredes</option>
<option value="4">Defensa avanzada</option>
</select>

</div>

<div class="pregunta">

Juego en red

<select id="p8">
<option value="0">Evito subir</option>
<option value="1">Subo pero fallo</option>
<option value="2">Voleas correctas</option>
<option value="3">Voleas ofensivas</option>
<option value="4">Cierro puntos</option>
</select>

</div>

<button class="btnBlue" onclick="calcularNivel()">Calcular nivel</button>
<button class="btnYellow" onclick="cerrarTest()">Volver</button>

</div>

<!-- MENU -->

<div id="menu" class="container">

<h3 id="saludo"></h3>

<button class="menuButton">Partidas</button>
<button class="menuButton" onclick="abrirJugadores()">Chat jugadores</button>
<button class="menuButton">Clasificación</button>
<button class="menuButton" onclick="mostrar('perfil')">Perfil</button>
<button class="menuButton">Tutoriales</button>
<button class="menuButton">Media Center</button>

<button class="logout" onclick="logout()">Cerrar sesión</button>

</div>

<div id="jugadores" class="container" style="display:none;">

  <h2>Jugadores</h2>

  <div id="listaJugadores"></div>

  <button onclick="mostrar('menu')">Volver</button>

</div>

<div id="perfil" class="container" style="display:none">

  <h3>Perfil</h3>

  <img id="fotoPerfil" width="120" style="border-radius:50%">

  <br><br>

  <button onclick="cambiarFoto()">Cambiar foto</button>

  <input type="file" id="inputFoto" style="display:none" accept="image/*">

  <br><br>

  <button onclick="mostrar('menu')">Volver</button>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
<script>

function mostrar(p){

document.getElementById("login").style.display="none";
document.getElementById("perfilCompletar").style.display="none";
document.getElementById("menu").style.display="none";
document.getElementById("testNivel").style.display="none";

document.getElementById(p).style.display="block";

}

function abrirTest(){mostrar("testNivel")}
function cerrarTest(){mostrar("perfilCompletar")}

function calcularNivel(){

let puntos=
parseInt(p1.value)+
parseInt(p2.value)+
parseInt(p3.value)+
parseInt(p4.value)+
parseInt(p5.value)+
parseInt(p6.value)+
parseInt(p7.value)+
parseInt(p8.value);

let nivel=(puntos/32)*7;
nivel=nivel.toFixed(2);

document.getElementById("nivelManual").value=nivel;
document.getElementById("nivelResultado").innerText="Nivel sugerido: "+nivel;

mostrar("perfilCompletar");

}

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

</script>

<script src="app.js"></script>

</body>
</html>
