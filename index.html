<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pádel Players Morvedre</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="header">
<img src="logo.png" class="logo">
<div class="title">Pádel Players Morvedre</div>
</div>

<!-- PERFIL -->
<div id="perfil" class="container" style="display:none;">

  <div class="perfil-header">

    <div class="perfil-top">
      <img id="fotoPerfil" class="foto-perfil" src="">

      <div class="perfil-info">
        <div style="display:flex; flex-direction:column; gap:5px;">

          <div style="display:flex; gap:10px; align-items:center;">
            <div id="nombrePerfil" class="nombre"></div>
            <div>· Mano: <span id="manoPerfil"></span></div>
          </div>

          <div style="display:flex; gap:10px; align-items:center;">
            <div id="nivelPerfil" class="puntos"></div>
            <div>· Posición: <span id="posicionPerfil"></span></div>
          </div>

        </div>
      </div>
    </div>

    <button onclick="mostrar('menu')">Volver</button>

    <div class="perfil-stats">
      <div class="stat">
        <div id="partidos">0</div>
        <span>Partidos</span>
      </div>
      <div class="stat">
        <div id="seguidores">0</div>
        <span>Seguidores</span>
      </div>
      <div class="stat">
        <div id="seguidos">0</div>
        <span>Seguidos</span>
      </div>
    </div>

    <div class="perfil-botones">
      <button id="btnEditar" onclick="editarPerfil()">Editar perfil</button>
      <button id="btnSeguir" class="btnYellow" style="display:none;">Seguir</button>
      <button id="btnEliminar" class="rojo" onclick="eliminarPerfil()">Eliminar perfil</button>
    </div>

  </div>

</div>

<!-- LOGIN -->
<div id="login" class="container">

<label>Email</label>
<input id="email">

<label>Contraseña</label>
<input id="pass" type="password">

<button class="btnBlue" onclick="registro()">Registrarse</button>
<button class="btnYellow" onclick="login()">Entrar</button>

<div id="msgAuth" class="error"></div>

</div>

<!-- PERFIL COMPLETAR -->
<div id="perfilCompletar" class="container">

<h3>Completar perfil</h3>

<p class="small">Los campos con <span class="req">*</span> son obligatorios</p>

<label>Foto</label>
<input type="file" id="inputFotoRegistro" accept="image/*">

<label>Nombre <span class="req">*</span></label>
<input id="nombre">
<div id="msgNombre" class="error"></div>

<label>Sexo <span class="req">*</span></label>
<select id="sexo">
<option value="">Seleccionar</option>
<option value="hombre">Hombre</option>
<option value="mujer">Mujer</option>
</select>

<label>Nivel <span class="req">*</span></label>

<select id="nivelManual">
<option value="">Elegir</option>
<option>0.5</option>
<option>0.75</option>
<option>1</option>
<option>1.25</option>
<option>1.5</option>
<option>1.75</option>
<option>2</option>
<option>2.25</option>
<option>2.5</option>
<option>2.75</option>
<option>3</option>
<option>3.25</option>
<option>3.5</option>
<option>3.75</option>
<option>4</option>
<option>4.25</option>
<option>4.5</option>
<option>4.75</option>
<option>5</option>
<option>5.25</option>
<option>5.5</option>
<option>5.75</option>
<option>6</option>
<option>6.25</option>
<option>6.5</option>
<option>6.75</option>
<option>7</option>
</select>

<button class="btnYellow" id="btnTestNivel" onclick="abrirTest()">Descubrir mi nivel</button>

<div id="nivelResultado" class="ok"></div>

<label>Mano <span class="req">*</span></label>
<select id="mano">
<option value="">Seleccionar</option>
<option value="derecha">Derecha</option>
<option value="izquierda">Izquierda</option>
</select>

<label>Posición <span class="req">*</span></label>
<select id="posicion">
<option value="">Seleccionar</option>
<option value="drive">Drive</option>
<option value="reves">Revés</option>
<option value="cualquiera">Cualquiera</option>
</select>

<p id="msgPerfil" style="color:red;"></p>

<button class="btnBlue" onclick="guardarPerfilRegistro()">Guardar perfil</button>

</div>

<!-- TEST NIVEL -->
<div id="testNivel" class="container">
<h3>Test de nivel</h3>
<button class="btnBlue" onclick="calcularNivel()">Calcular nivel</button>
</div>

<!-- EDITAR PERFIL -->
<div id="perfilEditar" class="container" style="display:none;">

  <img id="fotoPerfilEditar" style="width:100px; height:100px; border-radius:50%; margin-bottom:10px;">

  <button id="btnCambiarFoto" class="btnYellow" onclick="cambiarFoto()" style="display:none;">
    Cambiar foto
  </button>

  <input type="file" id="inputFotoEditar" accept="image/*" style="display:none;">

  <h3>Editar perfil</h3>

  <label>Mano</label>
  <select id="manoEditar">
    <option value="">Seleccionar</option>
    <option value="derecha">Derecha</option>
    <option value="izquierda">Izquierda</option>
  </select>

  <label>Posición</label>
  <select id="posicionEditar">
    <option value="">Seleccionar</option>
    <option value="drive">Drive</option>
    <option value="reves">Revés</option>
    <option value="cualquiera">Cualquiera</option>
  </select>

  <button class="btnGuardar" onclick="guardarPerfil()">Guardar</button>
  <button class="btnCancelar" onclick="mostrar('perfil')">Cancelar</button>

</div>

<!-- MENU -->
<div id="menu" class="container">

<h3 id="saludo"></h3>

<button class="menuButton" onclick="mostrar('crearPista')">Pistas</button>
<button class="menuButton">Partidas</button>
<button class="menuButton" onclick="abrirJugadores()">Jugadores</button>
<button class="menuButton">Clasificación</button>
<button class="menuButton" onclick="irPerfil()">Perfil</button>

<button class="logout" onclick="logout()">Cerrar sesión</button>

</div>

<!-- SCRIPTS -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>

<script src="perfil.js"></script>
<script src="jugadores.js"></script>
<script src="app.js"></script>

</body>
</html>
